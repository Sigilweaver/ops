# Sigilweaver version inventory
#
# Canonical record of the current published version of every Sigilweaver
# crate, Python package, and supporting repository. Update this file as
# part of each release so the rest of the suite has a single source of
# truth to read from.
#
# This file is *descriptive*, not prescriptive: it does not drive any
# release tooling, it documents what is currently shipped. CI/release
# scripts (scripts/check-versions.sh) read it to verify each repo's
# Cargo.toml / pyproject.toml is in sync.

# --------------------------------------------------------------------------
# Proteomics stack
# --------------------------------------------------------------------------
[proteomics]

[proteomics.openproteo]
repo = "Sigilweaver/OpenProteo"
crate = "openproteo-io"
crates_version = "1.0.3"
cli_crate = "openproteo-io-cli"
cli_version = "1.0.3"
pypi = "openproteo"
pypi_version = "1.0.3"

[proteomics.openproteo-core]
repo = "Sigilweaver/OpenProteoCore"
crate = "openproteo-core"
crates_version = "1.0.1"

[proteomics.opentfraw]
repo = "Sigilweaver/OpenTFRaw"
crate = "opentfraw"
crates_version = "1.0.6"
pypi = "opentfraw"
pypi_version = "1.0.6"

[proteomics.OpenTimsTDF]
repo = "Sigilweaver/OpenTimsTDF"
crate = "OpenTimsTDF"
crates_version = "1.0.6"
pypi = "opentimstdf"
pypi_version = "1.0.6"

[proteomics.openwraw]
repo = "Sigilweaver/OpenWRaw"
crate = "openwraw"
crates_version = "1.0.5"
pypi = "openwraw"
pypi_version = "1.0.5"

[proteomics.prolance]
repo = "Sigilweaver/ProLance"
crate = "prolance"
crates_version = "0.1.0"
status = "unpublished"

# --------------------------------------------------------------------------
# Data formats
# --------------------------------------------------------------------------
[formats]

[formats.openqvd]
repo = "Sigilweaver/OpenQVD"
crate = "openqvd"
crates_version = "1.1.0"
pypi = "openqvd"
pypi_version = "1.1.0"

[formats.openyxdb]
repo = "Sigilweaver/OpenYXDB"
pypi = "openyxdb"
pypi_version = "1.4.0"

[formats.openqbw]
repo = "Sigilweaver/OpenQBW"
crate = "openqbw"
crates_version = "0.1.0"
cli_crate = "openqbw-cli"
cli_version = "0.1.0"
pypi = "openqbw"
pypi_version = "0.1.0"

[formats.opensqlanywhere]
repo = "Sigilweaver/OpenSQLAnywhere"
crate = "opensqlany"
crates_version = "0.1.0"
cli_crate = "opensqlany-cli"
cli_version = "0.1.0"

# --------------------------------------------------------------------------
# Scientific / bioinformatics
# --------------------------------------------------------------------------
[scientific]

[scientific.biolance]
repo = "Sigilweaver/BioLance"
crate = "biolance-cli"
crates_version = "0.2.0"
status = "unpublished"

[scientific.openkspace]
repo = "Sigilweaver/OpenKSpace"
crate = "openkspace-cli"
crates_version = "0.2.0"
status = "unpublished"

[scientific.dicom-atlas]
repo = "Sigilweaver/DICOM-Atlas"
crate = "dicom-map"
crates_version = "0.2.0"
pypi = "dicom-map"
pypi_version = "0.1.0"

# --------------------------------------------------------------------------
# Infrastructure & site
# --------------------------------------------------------------------------
[infrastructure]

[infrastructure.loom]
repo = "Sigilweaver/Loom"
status = "pre-release"

[infrastructure.website]
repo = "Sigilweaver/Site"
deploy = "sigilweaver.app"

[infrastructure.blog]
repo = "Sigilweaver/Blog"
deploy = "sigilweaver.app/blog"

# --------------------------------------------------------------------------
# Toolchain policy
# --------------------------------------------------------------------------
[policy]
# Minimum Rust version honored across all libraries that have not pinned
# their own MSRV for compatibility reasons.
msrv = "1.87"

# Standard Python version matrix for maturin-built bindings.
python_versions = ["3.9", "3.10", "3.11", "3.12", "3.13"]

# License: every Sigilweaver library is Apache-2.0 unless explicitly
# noted in its repo. Documentation is CC-BY-SA 4.0.
license = "Apache-2.0"
docs_license = "CC-BY-SA-4.0"

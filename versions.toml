# Sigilweaver version inventory
#
# Canonical record of the current published version of every Sigilweaver
# crate, Python package, and supporting repository. Update this file as
# part of each release so the rest of the suite has a single source of
# truth to read from.
#
# This file is *descriptive*, not prescriptive: it does not drive any
# release tooling, it documents what is currently shipped. CI/release
# scripts (scripts/check-versions.sh) read it to verify each repo's
# Cargo.toml / pyproject.toml is in sync.

# --------------------------------------------------------------------------
# Mass spectrometry stack
# --------------------------------------------------------------------------
[mass_spectrometry]

[mass_spectrometry.openmassspec]
repo = "Sigilweaver/OpenMassSpec"
crate = "openmassspec-io"
crates_version = "1.4.0"
cli_crate = "openmassspec-io-cli"
cli_version = "1.4.0"
pypi = "openmassspec"
pypi_version = "1.4.0"

[mass_spectrometry.openmassspec-core]
repo = "Sigilweaver/OpenMassSpecCore"
crate = "openmassspec-core"
crates_version = "1.2.0"

[mass_spectrometry.openaraw]
repo = "Sigilweaver/OpenARaw"
crate = "openaraw"
crates_version = "0.1.2"
pypi = "openaraw"
pypi_version = "0.1.2"

[mass_spectrometry.opensxraw]
repo = "Sigilweaver/OpenSXRaw"
crate = "opensxraw"
crates_version = "0.2.1"
pypi = "opensxraw"
pypi_version = "0.2.1"

[mass_spectrometry.opentfraw]
repo = "Sigilweaver/OpenTFRaw"
crate = "opentfraw"
crates_version = "1.3.4"
pypi = "opentfraw"
pypi_version = "1.3.4"

[mass_spectrometry.OpenTimsTDF]
repo = "Sigilweaver/OpenTimsTDF"
crate = "OpenTimsTDF"
crates_version = "1.3.0"
pypi = "opentimstdf"
pypi_version = "1.3.0"

[mass_spectrometry.openwraw]
repo = "Sigilweaver/OpenWRaw"
crate = "openwraw"
crates_version = "1.2.5"
pypi = "openwraw"
pypi_version = "1.2.5"

[mass_spectrometry.openszraw]
repo = "Sigilweaver/OpenSZRaw"
crate = "openszraw"
crates_version = "0.1.0"
pypi = "openszraw"
pypi_version = "0.1.0"

[mass_spectrometry.speclance]
repo = "Sigilweaver/SpecLance"
crate = "speclance-core"
crates_version = "0.2.0-alpha"
ms_crate = "speclance-ms"
ms_version = "0.2.0-alpha"
pypi = "speclance"
pypi_version = "0.2.0a0"

